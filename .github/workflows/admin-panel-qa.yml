name: TopsyFox Ore UI Website QA

on:
  push:
    branches:
      - main
      - feature/ore-ui-admin-redesign
      - feature/ore-ui-reference-fidelity
    paths:
      - "admin-panel/**"
      - ".github/workflows/admin-panel-qa.yml"
  pull_request:
    paths:
      - "admin-panel/**"
      - ".github/workflows/admin-panel-qa.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify DOM, new stylesheet and JavaScript syntax
        run: python3 admin-panel/tests/smoke.py
      - name: Install browser validation tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Check desktop and mobile in Chromium
        run: node admin-panel/tests/browser-smoke.cjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topsyfox-ore-ui-browser-screenshots
          path: admin-panel/tests/screenshots/
          if-no-files-found: ignore
      - name: Verify homepage not overwritten
        run: |
          test -f index.html
          grep -q "MeteorHost" index.html
